function fo(){const o={};$('#df').querySelectorAll('[name]').forEach(x=>o[x.name]=x.value);return o}

const icsE=t=>String(t).replace(/\\/g,'\\\\').replace(/;/g,'\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
const icd=d=>d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
function fold(l){const o=[];let c='',n=0;for(const ch of l){const b=te.encode(ch).length;if(n+b>(o.length?73:75)){o.push(c);c='';n=0}c+=ch;n+=b}o.push(c);return o.join('\r\n ')}
async function icsExp(){
 const c=await choose('📅 Rappels dans le calendrier',['Avec les détails (titulaire, organisme, montant)','Discret : numéro de marché seulement']);if(c<0)return;
 const dis=c==1,ev=[];
 db.garanties.forEach(g=>{const a=gal(g);if(!a||a.j<0||a.j>=9999)return;const m=mk(g.marche);
  ev.push({id:'g'+g.id,d:D(g.echeance),t:`PTUA – Échéance garantie ${g.type} · ${mn(g.marche)}`,x:dis?'Détail dans l’application PTUA.':`Organisme : ${g.organisme||'—'}\nMontant : ${fmt(g.montant)} FCFA\nTitulaire : ${m?.titulaire||'—'}\nÀ faire : renouvellement, prorogation ou mainlevée.`,al:[30,15,7,1]})});
 db.marches.forEach(m=>{const r=calc(m);if(!r||m.reception||r.fin<today)return;
  ev.push({id:'m'+m.id,d:r.fin,t:`PTUA – Fin prévue du marché ${m.num}`,x:dis?'Détail dans l’application PTUA.':`Titulaire : ${m.titulaire||'—'}\nObjet : ${m.objet||'—'}`,al:[30,7]})});
 db.assurances.forEach(a=>{const x=galA(a);if(!x||x.j<0||x.j>=9999)return;ev.push({id:'a'+a.id,d:D(a.echeance),t:`PTUA – Échéance assurance ${a.type} · ${mn(a.marche)}`,x:dis?'Détail dans l’application PTUA.':`Assureur : ${a.assureur||'—'}\nPolice : ${a.police||'—'}\nCapital assuré : ${fmt(a.montant)} FCFA\nÀ faire : renouvellement ou attestation à jour.`,al:[30,15,7,1]})});
 db.os.forEach(o=>{const f=osFin(o);if(!f||f<today)return;
  ev.push({id:'o'+o.id,d:f,t:`PTUA – Fin de durée OS ${o.num||o.type} · ${mn(o.marche)}`,x:dis?'':(o.note||''),al:[15,3]})});
 if(!ev.length)return alert('Aucune échéance future à ajouter (garanties actives avec une date d’échéance, fins prévues de marchés, durées d’OS).');
 const st=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z',L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//PTUA//Gestionnaire PTUA v8.6//FR','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:PTUA – échéances'];
 const al=(t,tr)=>L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsE(t),'TRIGGER:'+tr,'END:VALARM');
 ev.forEach(e=>{L.push('BEGIN:VEVENT',`UID:ptua-${e.id}-${icd(e.d)}@ptua.app`,'DTSTAMP:'+st,'DTSTART;VALUE=DATE:'+icd(e.d),'DTEND;VALUE=DATE:'+icd(new Date(e.d.getTime()+day)),'SUMMARY:'+icsE(e.t));
  if(e.x)L.push('DESCRIPTION:'+icsE(e.x));L.push('TRANSP:TRANSPARENT');
  e.al.forEach(j=>{if(diff(e.d,today)>=j)al(`Dans ${j} jour${j>1?'s':''} : ${e.t}`,j>1?`-P${j-1}DT15H`:'-PT15H')});al(e.t,'PT9H');L.push('END:VEVENT')});
 L.push('END:VCALENDAR');
 offer('PTUA_echeances_'+stamp()+'.ics',L.map(fold).join('\r\n')+'\r\n','text/calendar',ev.length+' échéance(s) prête(s) pour le calendrier',
  'Rappels à 9 h : 30, 15, 7 et 1 jour(s) avant chaque échéance de garantie, et le jour même.<br><b>Sur iPhone :</b> touchez « Enregistrer le fichier » → <b>Enregistrer dans Fichiers</b>, puis ouvrez le fichier dans l’app <b>Fichiers</b> et touchez <b>Ajouter tout</b>. Si l’option <b>Calendrier</b> apparaît directement dans le partage, choisissez-la.<br>Après des modifications, réexportez : les mêmes échéances sont mises à jour plutôt que dupliquées (sauf si la date a changé : supprimez alors l’ancien événement).')}
