body,[data-t=dark] body{font:15px/1.5 'Public Sans','Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);font-feature-settings:'tnum' 1}

header{background:var(--hd);box-shadow:none;gap:12px;flex-wrap:nowrap}
.lg{flex:1;min-width:0;gap:12px}h1{font-size:17px;font-weight:700;letter-spacing:-.01em;line-height:1.25}h1 small{font-weight:500;margin-left:4px}
.hr{flex:none;border:0;background:none;box-shadow:none;padding:0;align-items:flex-end}.hr b{font-size:17px;font-weight:600;letter-spacing:0}.hr small{font-size:11.5px}

button.on,button.pri,[data-t=dark] button.on,[data-t=dark] button.pri{background:var(--p);color:var(--bt);border-color:var(--p);box-shadow:none;font-weight:600}
button.pri:hover{background:var(--p);filter:brightness(1.1)}
input,select{border-radius:10px}
.k,.card,.w,.sl{background:var(--c);backdrop-filter:none;-webkit-backdrop-filter:none;border-radius:14px;box-shadow:var(--sh)}

main>*{animation:none}

/* v8.3 — documents joints */

#dv{width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;margin:0;padding:0;border:0;border-radius:0;background:var(--c);animation:none;overflow:hidden}#dv[open]{display:flex;flex-direction:column}
.vt{display:flex;gap:6px;align-items:center;padding:max(8px,env(safe-area-inset-top)) 12px 8px;border-bottom:1px solid var(--b);flex:none}.vn{flex:1;min-width:0;display:flex;flex-direction:column}.vn b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.vn small{color:var(--m)}

.vb{flex:1;overflow:auto;background:#566074;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}.vz{margin:0 auto;padding:4px 10px calc(16px + env(safe-area-inset-bottom));box-sizing:border-box}

.cym small{display:block;margin-top:4px;opacity:.75;font-size:11px}

// Relance automatique en cas d'échec (panne du service, hors ligne, synchronisation absente…) :
// quelques tentatives rapprochées, puis une reprise à chaque réouverture de l'application ou au
// retour du réseau, jusqu'à PV_MAX tentatives au total. L'audio original, lui, est toujours
// enregistré dès l'arrêt de l'enregistrement, quel que soit le sort de la transcription.

function pvEnqueue(id){if(!REVQ.includes(id))REVQ.push(id);if(!REVRUN)pvRun()}
async function pvRun(){REVRUN=true;
 try{while(REVQ.length){REVCUR=REVQ.shift();await pvProcess(REVCUR)}}
 finally{REVRUN=false;REVCUR=null;JOB.pv=null;jobUI()}}

function addDur(d0,m,j){m=+m||0;j=+j||0;const wm=Math.trunc(m),x=new Date(d0);x.setMonth(x.getMonth()+wm);if(x.getDate()!=d0.getDate())x.setDate(0);return new Date(x.getTime()+(j+Math.round((m-wm)*30))*day)}
function osFin(o){return o&&o.date&&(+o.dureeM||+o.jours)?addDur(D(o.date),o.dureeM,o.jours):null}
function osDays(o){const f=osFin(o);return f?Math.max(0,diff(f,D(o.date))):(+o.jours||0)+Math.round((+o.dureeM||0)*30)}
